[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophix-client-management"
version = "2026.10.04.01"
description = "Client management and token rotation policy for Ophix Project servers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ophix Project" }
]
keywords = ["django", "ophix", "token", "rotation", "security", "admin", "client", "management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "ophix-server-base>=2026.06.24.01",
]

[project.urls]
Homepage = "https://ophix.io"
Source = "https://github.com/ophixproject/ophix-client-management"

[project.entry-points."ophix.plugins"]
ophix_client_management = "ophix_client_management"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ophix_client_management = [
    "OPHIX_RELEASE_NOTES.md",
    "templates/**/*",
    "static/**/*",
    "deploy_templates/**/*",
    "docs/**/*",
]
